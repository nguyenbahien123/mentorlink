spring:
  config:
    activate:
      on-profile: prod
  devtools:
    add-properties: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# application-prod.yml
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  secretKey: ${JWT_SECRET_KEY}
 
# Frontend base URL for redirects (override in environment for production)
app:
  frontend:
    url: ${APP_FRONTEND_URL:http://mentorlink.io.vn}
