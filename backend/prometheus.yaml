# prometheus.yaml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: 'mentorlink-backend'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: [ 'mentorlink-backend:8080' ]
        labels:
          application: 'mentorlink-backend'